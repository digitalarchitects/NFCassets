<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Profile - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="card asset-card mx-auto">
            <div class="card-body">
                <h4 class="card-title mb-3">Profile</h4>

                <div id="profile-info" class="mb-3">
                    <p><strong>Username:</strong> <span id="prof-username"></span></p>
                    <p><strong>Role:</strong> <span id="prof-role"></span></p>
                    <p><strong>Member since:</strong> <span id="prof-created"></span></p>
                </div>

                <hr />

                <h5 class="mb-3">Change Password</h5>
                <form id="password-form">
                    <div class="mb-2">
                        <label class="form-label" for="current-password">Current Password</label>
                        <input type="password" class="form-control" id="current-password" required />
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="new-password">New Password</label>
                        <input type="password" class="form-control" id="new-password" required minlength="4" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirm-password">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm-password" required minlength="4" />
                    </div>
                    <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
                <div id="pw-msg" class="alert mt-3 d-none"></div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
