<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Users - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Users</h4>
            <button class="btn btn-primary" id="add-toggle-btn">Add User</button>
        </div>

        <div id="add-panel" class="card mb-3 d-none">
            <div class="card-body">
                <h5 class="card-title">Add User</h5>
                <form id="add-form">
                    <div class="mb-2">
                        <label class="form-label" for="new-username">Username</label>
                        <input type="text" class="form-control" id="new-username" required />
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="new-password">Password</label>
                        <input type="password" class="form-control" id="new-password" required minlength="4" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="new-role">Role</label>
                        <select class="form-select" id="new-role">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Create User</button>
                </form>
                <div id="add-error" class="alert alert-danger mt-2 d-none"></div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-rows"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/users.js"></script>
</body>
</html>
