<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Master Lists - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <ul class="nav nav-tabs mb-3" id="list-tabs">
            <li class="nav-item"><button class="nav-link active" data-tab="locations">Locations</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="makes">Makes &amp; Models</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="categories">Categories</button></li>
        </ul>

        <!-- Locations Tab -->
        <div id="tab-locations">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5>Locations</h5>
                <button class="btn btn-primary btn-sm" id="loc-add-btn">Add Location</button>
            </div>
            <div id="loc-add-form" class="card mb-2 d-none">
                <div class="card-body">
                    <form id="loc-form" class="row g-2">
                        <div class="col"><input type="text" class="form-control" placeholder="Location name" id="loc-name" required /></div>
                        <div class="col-auto"><button type="submit" class="btn btn-success">Save</button></div>
                    </form>
                    <div id="loc-error" class="alert alert-danger mt-2 d-none"></div>
                </div>
            </div>
            <table class="table table-striped table-sm">
                <thead><tr><th>Name</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="loc-rows"></tbody>
            </table>
        </div>

        <!-- Makes & Models Tab -->
        <div id="tab-makes" class="d-none">
            <div class="row">
                <div class="col-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5>Makes</h5>
                        <button class="btn btn-primary btn-sm" id="make-add-btn">Add Make</button>
                    </div>
                    <div id="make-add-form" class="card mb-2 d-none">
                        <div class="card-body">
                            <form id="make-form" class="row g-2">
                                <div class="col"><input type="text" class="form-control" placeholder="Make name" id="make-name" required /></div>
                                <div class="col-auto"><button type="submit" class="btn btn-success">Save</button></div>
                            </form>
                            <div id="make-error" class="alert alert-danger mt-2 d-none"></div>
                        </div>
                    </div>
                    <table class="table table-striped table-sm">
                        <thead><tr><th>Name</th><th>Actions</th></tr></thead>
                        <tbody id="make-rows"></tbody>
                    </table>
                </div>
                <div class="col-md-7">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5>Models <span class="text-muted small" id="model-make-label"></span></h5>
                        <button class="btn btn-primary btn-sm" id="model-add-btn" disabled>Add Model</button>
                    </div>
                    <div id="model-add-form" class="card mb-2 d-none">
                        <div class="card-body">
                            <form id="model-form" class="row g-2">
                                <div class="col"><input type="text" class="form-control" placeholder="Model name" id="model-name" required /></div>
                                <div class="col-auto"><button type="submit" class="btn btn-success">Save</button></div>
                            </form>
                            <div id="model-error" class="alert alert-danger mt-2 d-none"></div>
                        </div>
                    </div>
                    <table class="table table-striped table-sm">
                        <thead><tr><th>Name</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="model-rows"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Categories Tab -->
        <div id="tab-categories" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5>Categories</h5>
                <button class="btn btn-primary btn-sm" id="cat-add-btn">Add Category</button>
            </div>
            <div id="cat-add-form" class="card mb-2 d-none">
                <div class="card-body">
                    <form id="cat-form" class="row g-2">
                        <div class="col"><input type="text" class="form-control" placeholder="Category name" id="cat-name" required /></div>
                        <div class="col-auto"><button type="submit" class="btn btn-success">Save</button></div>
                    </form>
                    <div id="cat-error" class="alert alert-danger mt-2 d-none"></div>
                </div>
            </div>
            <table class="table table-striped table-sm">
                <thead><tr><th>Name</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="cat-rows"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/lists.js"></script>
</body>
</html>
