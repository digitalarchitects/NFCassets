<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LDAP Import - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="card asset-card mx-auto mb-3">
            <div class="card-body">
                <h4 class="card-title">LDAP / Active Directory Import</h4>

                <form id="ldap-form" class="mb-3">
                    <div class="mb-2">
                        <label class="form-label">LDAP URL</label>
                        <input type="text" class="form-control" id="ldap-url" placeholder="ldap://dc.example.com" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Base DN</label>
                        <input type="text" class="form-control" id="ldap-base-dn" placeholder="OU=Users,DC=example,DC=com" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Bind DN</label>
                        <input type="text" class="form-control" id="ldap-bind-dn" placeholder="CN=ldap-reader,DC=example,DC=com" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bind Password</label>
                        <input type="password" class="form-control" id="ldap-password" />
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary" id="test-btn">Test Connection</button>
                        <button type="button" class="btn btn-success" id="import-btn">Import Now</button>
                    </div>
                </form>

                <div id="status-msg" class="alert d-none"></div>
                <div id="import-result" class="d-none">
                    <h6>Import Results</h6>
                    <table class="table table-sm">
                        <tr><td>Created</td><td id="res-created">-</td></tr>
                        <tr><td>Updated</td><td id="res-updated">-</td></tr>
                        <tr><td>Issues</td><td id="res-issues">-</td></tr>
                    </table>
                    <div id="res-errors" class="text-danger small"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/ldap.js"></script>
</body>
</html>
