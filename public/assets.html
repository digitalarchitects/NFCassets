<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Assets - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <!-- Search & Filters -->
        <div class="row mb-3">
            <div class="col-md-12">
                <div class="input-group mb-2">
                    <input type="text" class="form-control" id="search-input" placeholder="Search by asset no, serial, owner, location..." />
                    <select class="form-select" id="status-filter" style="max-width: 140px;">
                        <option value="">All statuses</option>
                        <option value="active">Active</option>
                        <option value="missing">Missing</option>
                        <option value="retired">Retired</option>
                    </select>
                    <button class="btn btn-primary" id="search-btn">Search</button>
                    <button class="btn btn-outline-primary d-none" id="add-toggle-btn">Add Asset</button>
                </div>
                <div class="row g-2" id="filter-row">
                    <div class="col-md-3"><select class="form-select form-select-sm filter-dropdown" id="filter-location"><option value="">All locations</option></select></div>
                    <div class="col-md-3"><select class="form-select form-select-sm filter-dropdown" id="filter-make"><option value="">All makes</option></select></div>
                    <div class="col-md-3"><select class="form-select form-select-sm filter-dropdown" id="filter-category"><option value="">All categories</option></select></div>
                </div>
            </div>
        </div>

        <!-- Add Asset Panel -->
        <div id="add-panel" class="card mb-3 d-none">
            <div class="card-body">
                <h5>New Asset</h5>
                <form id="add-form" class="row g-2">
                    <div class="col-md-3"><input class="form-control" id="new-asset-no" placeholder="Asset No" required /></div>
                    <div class="col-md-3"><input class="form-control" id="new-serial-no" placeholder="Serial No" /></div>
                    <div class="col-md-4"><input class="form-control" id="new-description" placeholder="Description" /></div>
                    <div class="col-md-2"><input class="form-control" id="new-owner" placeholder="Owner" /></div>
                    <div class="col-md-3"><select class="form-select" id="new-location"><option value="">Location</option></select></div>
                    <div class="col-md-3"><select class="form-select" id="new-category"><option value="">Category</option></select></div>
                    <div class="col-md-3"><select class="form-select" id="new-make"><option value="">Make</option></select></div>
                    <div class="col-md-3"><select class="form-select" id="new-model"><option value="">Model</option></select></div>
                    <div class="col-md-12 d-grid"><button class="btn btn-success" type="submit">Create</button></div>
                </form>

                <hr />
                <h6>Bulk Import (CSV)</h6>
                <p class="text-muted small">Columns: AssetNo,SerialNo,Description,Owner,Location</p>
                <input type="file" class="form-control" id="csv-input" accept=".csv,text/csv" />
                <button class="btn btn-outline-secondary btn-sm mt-2" id="import-btn">Import</button>
                <div id="import-result" class="small mt-2"></div>
            </div>
        </div>

        <table class="table table-hover bg-white">
            <thead>
                <tr>
                    <th>Asset No</th>
                    <th>Description</th>
                    <th>Make / Model</th>
                    <th>Owner</th>
                    <th>Location</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="asset-rows"></tbody>
        </table>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/assets-list.js"></script>
</body>
</html>
