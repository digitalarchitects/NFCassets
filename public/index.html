<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dashboard - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="row g-3 mb-4">
            <div class="col-4">
                <div class="card stat-card">
                    <div class="value" id="stat-total">-</div>
                    <div class="text-muted">Assets</div>
                </div>
            </div>
            <div class="col-4">
                <div class="card stat-card">
                    <div class="value" id="stat-checked">-</div>
                    <div class="text-muted">Checked Today</div>
                </div>
            </div>
            <div class="col-4">
                <div class="card stat-card">
                    <div class="value text-danger" id="stat-missing">-</div>
                    <div class="text-muted">Missing</div>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2" style="max-width: 320px; margin: 0 auto;">
            <a href="/scan.html" class="btn btn-primary btn-lg">Scan Asset</a>
            <a href="/assets.html" class="btn btn-outline-secondary btn-lg">Search Assets</a>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
