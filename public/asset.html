<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Asset - Asset Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div id="not-found" class="alert alert-warning d-none">Asset not found.</div>

        <div id="asset-view" class="d-none">
            <div class="card asset-card mx-auto mb-3">
                <img id="asset-photo" class="card-img-top d-none" alt="Asset photo" />
                <div class="card-body">
                    <h4 class="card-title" id="asset-title">-</h4>
                    <p class="mb-1"><strong>Asset No:</strong> <span id="asset-no"></span></p>
                    <p class="mb-1"><strong>Serial:</strong> <span id="asset-serial"></span></p>
                    <p class="mb-1"><strong>Assigned To:</strong> <span id="asset-owner"></span></p>
                    <p class="mb-1"><strong>Location:</strong> <span id="asset-location"></span></p>
                    <p class="mb-3"><strong>Status:</strong> <span id="asset-status" class="badge bg-secondary"></span></p>

                    <div class="d-grid gap-2">
                        <button id="verify-btn" class="btn btn-success">Verify Present</button>
                        <button id="transfer-toggle-btn" class="btn btn-primary">Transfer</button>
                        <button id="history-toggle-btn" class="btn btn-outline-secondary">History</button>
                        <button id="write-tag-btn" class="btn btn-outline-dark d-none">Write to NFC Tag</button>
                    </div>

                    <form id="photo-form" class="mt-3">
                        <label class="form-label" for="photo-input">Photo</label>
                        <input type="file" class="form-control" id="photo-input" accept="image/*" capture="environment" />
                        <button class="btn btn-sm btn-outline-secondary mt-2" type="submit">Upload Photo</button>
                    </form>

                    <div id="action-msg" class="alert alert-info mt-3 d-none"></div>
                </div>
            </div>

            <div id="transfer-panel" class="card asset-card mx-auto mb-3 d-none">
                <div class="card-body">
                    <h5>Transfer Asset</h5>
                    <form id="transfer-form">
                        <div class="mb-2">
                            <label class="form-label">New Owner</label>
                            <input type="text" class="form-control" id="new-owner" />
                        </div>
                        <div class="mb-2">
                            <label class="form-label">New Location</label>
                            <input type="text" class="form-control" id="new-location" />
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>

            <div id="history-panel" class="card asset-card mx-auto mb-3 d-none">
                <div class="card-body">
                    <h5>History</h5>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/offline-queue.js"></script>
    <script src="/js/asset.js"></script>
</body>
</html>
